name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend and workflow checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: backend/go.sum
      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - name: Keep GitHub as the progress source
        run: |
          python3 scripts/tracker-status.py check
          python3 -m json.tool .github/main-ci-ruleset.json > /dev/null
      - name: Backend tests, race detector, vet and restart demo
        working-directory: backend
        run: |
          go test ./...
          go test -race ./...
          go vet ./...
          go run ./cmd/varde-demo
      - name: Synthetic fixture helper tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  android:
    name: Android JVM, transport and build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          dependency-graph: disabled
      - name: Both JVM variants, real-Go transport, lint and builds
        working-directory: android
        run: >-
          ./gradlew --no-daemon --stacktrace
          :app:testDebugUnitTest :app:testReleaseUnitTest :app:goHistoryTest
          :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleRelease
      - name: Save Android reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-jvm-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  android-emulator:
    name: Android emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          dependency-graph: disabled
      - name: Enable KVM on the disposable runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumentation on an isolated emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          disable-spellchecker: true
          working-directory: android
          script: ./gradlew --no-daemon --stacktrace :app:connectedDebugAndroidTest
      - name: Save emulator reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-emulator-reports
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 7

  compose:
    name: Linux Compose smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose -p varde-ci config --quiet
      - name: Build and verify disposable backend persistence
        run: python3 scripts/test-compose.py
